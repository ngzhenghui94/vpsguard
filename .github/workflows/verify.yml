name: Verify Ubuntu scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -v
      - name: Install OpenSCAP on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openscap-scanner
      - name: Scan the disposable Ubuntu runner
        shell: bash
        run: |
          umask 077
          set +e
          sudo python3 vpsguard.py scan --output "$RUNNER_TEMP/vpsguard-scan" > "$RUNNER_TEMP/scan-console.json"
          status=$?
          set -e
          sudo python3 - "$RUNNER_TEMP/vpsguard-scan/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          print(json.dumps({'status': report['status'], 'counts': report['counts'],
                            'findings': len(report['findings'])}, indent=2))
          assert report['status'] == 'complete', report.get('limitations')
          PY
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
