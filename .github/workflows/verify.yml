name: Verify native distro scans

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run regression tests
        run: python3 -m unittest discover -v

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13
            image: debian:13
          - target: ubuntu24
            image: ubuntu:24.04
          - target: alma9
            image: almalinux:9
          - target: opensuse16
            image: opensuse/leap:16.0
          - target: fedora43
            image: fedora:43
          - target: amazon2023
            image: amazonlinux:2023
    name: Native packages (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan or audit a disposable native container
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --pull=always \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --workdir /src \
            "$IMAGE" bash /src/integration_scan.sh "$TARGET"
